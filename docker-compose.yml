services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookero
      POSTGRES_USER: bookero
      POSTGRES_PASSWORD: bookero
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookero -d bookero"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookero
      SPRING_DATASOURCE_USERNAME: bookero
      SPRING_DATASOURCE_PASSWORD: bookero
      ANALYTICS_BASE_URL: http://analytics:8001
      JWT_SECRET: bookero-dev-secret-change-me-32chars
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  analytics:
    build: ./services/analytics
    ports: ["8001:8001"]
    environment:
      DATABASE_URL: postgresql://bookero:bookero@postgres:5432/bookero
      DATA_DIR: /data
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_ANALYTICS_URL: http://localhost:8001
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_ANALYTICS_URL: http://localhost:8001
    depends_on:
      api:
        condition: service_started
      analytics:
        condition: service_started

volumes:
  pgdata:
